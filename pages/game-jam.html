<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="幻想边境 Game Jam">
    <title>幻想边境 Game Jam</title>
    <link rel="icon" href="/img/幻想边境logo像素ver.png">
    <link rel="stylesheet" href="/css/head.css">
    <link rel="stylesheet" href="/css/game-jam.css">
</head>
<body>
    <main class="jam-page">
        <section class="jam-hero" aria-labelledby="jam-title">
            <img class="jam-hero-art" src="/img/game-jam-hero.svg">
            <div class="jam-hero-copy">
                <p class="jam-kicker">GENSOUEDGE PRESENTS</p>
                <h1 id="jam-title">幻想边境<br><span>GAME JAM</span></h1>
                <p class="jam-lead">文案</p>
                <div class="jam-actions">
                    <a class="jam-button jam-button-primary" href="#jam-join">加入创作</a>
                    <a class="jam-button jam-button-ghost" href="#jam-rules">查看规则</a>
                </div>
            </div>
            <div class="jam-status" aria-label="活动信息">
                <span>线上</span>
                <strong>时间</strong>
                <span>组队需求</span>
            </div>
        </section>

        <section class="jam-intro" aria-labelledby="jam-about">
            <div>
                <p class="jam-section-no">文案</p>
                <h2 id="jam-about">文案</h2>
            </div>
            <p>文案</p>
        </section>

        <section class="jam-feature-grid" aria-label="活动特色">
            <article class="jam-feature jam-feature-cyan">
                <img src="/img/game-jam-spark.svg">
                <p class="jam-section-no">THEME</p>
                <h2>文案</h2>
                <p>文案</p>
            </article>
            <article class="jam-feature jam-feature-yellow">
                <span class="jam-big-number">时间</span>
                <p class="jam-section-no">时间</p>
                <h2>文案</h2>
                <p>文案</p>
            </article>
            <article class="jam-feature jam-feature-pink">
                <img src="/img/game-jam-orbit.svg">
                <p class="jam-section-no">文案</p>
                <h2>文案</h2>
                <p>文案</p>
            </article>
        </section>

        <section class="jam-rules" id="jam-rules" aria-labelledby="jam-rules-title">
            <div class="jam-rules-heading">
                <p class="jam-section-no">文案</p>
                <h2 id="jam-rules-title">文案</h2>
            </div>
            <ol class="jam-rule-list">
                文案
            </ol>
        </section>

        <section class="jam-join" id="jam-join" aria-labelledby="jam-join-title">
            <div>
                <p class="jam-section-no">文案</p>
                <h2 id="jam-join-title">文案</h2>
                <p>文案</p>
            </div>
            <div class="jam-contact">
                <span>文案</span>
                <strong>文案</strong>
                <a href="mailto:GensouEdge@163.com">GensouEdge@163.com</a>
            </div>
        </section>
    </main>
</body>
</html>
